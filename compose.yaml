
name: nosql-github-assistant

services:

  # ==============================
  # MongoDB - Primary Database
  # ==============================
  mongodb:
    image: mongo:8.0
    container_name: nosql-mongodb
    restart: unless-stopped

    ports:
      - "127.0.0.1:27017:27017"

    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all

    volumes:
      - mongodb_data:/data/db

  # ==============================
  # Elasticsearch - Search Engine
  # ==============================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.25
    container_name: nosql-elasticsearch
    restart: unless-stopped

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms768m -Xmx768m

    ports:
      - "127.0.0.1:9200:9200"

    mem_limit: 2g

    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  # ==============================
  # Neo4j - Graph Database
  # ==============================
  neo4j:
    image: neo4j:2026.10.2
    container_name: nosql-neo4j
    restart: unless-stopped

    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 768m
      NEO4J_server_memory_pagecache_size: 512m

    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"

    mem_limit: 2g

    volumes:
      - neo4j_data:/data

volumes:
  mongodb_data:
  elasticsearch_data:
  neo4j_data:
