
name: nosql-github-assistant

services:

  # ==============================
  # MongoDB - Primary Database
  # ==============================
  mongodb:
    image: mongo:8.0
    container_name: nosql-mongodb
    restart: unless-stopped

    ports:
      - "127.0.0.1:27017:27017"

    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all

    volumes:
      - mongodb_data:/data/db

  # ==============================
  # Elasticsearch - Search Engine
  # ==============================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.25
    container_name: nosql-elasticsearch
    restart: unless-stopped

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms768m -Xmx768m

    ports:
      - "127.0.0.1:9200:9200"

    mem_limit: 2g

    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  # ==============================
  # Neo4j - Graph Database
  # ==============================
  neo4j:
    image: neo4j:2026.10.2
    container_name: nosql-neo4j
    restart: unless-stopped

    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 768m
      NEO4J_server_memory_pagecache_size: 512m

    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"

    mem_limit: 2g

    volumes:
      - neo4j_data:/data

  # ==============================
  # Apache Kafka - Event Streaming
  # ==============================
  kafka:
    image: apache/kafka:4.2.2
    container_name: nosql-kafka
    hostname: kafka
    restart: unless-stopped

    ports:
      - "127.0.0.1:9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092"

      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx1g"

    mem_limit: 2g

    volumes:
      - kafka_data:/tmp/kraft-combined-logs

# ==============================
# Persistent Docker Volumes
# ==============================
volumes:
  mongodb_data:
  elasticsearch_data:
  neo4j_data:
  kafka_data:
