
name: nosql-github-assistant

services:
  mongodb:
    image: mongo:8.0
    container_name: nosql-mongodb
    restart: unless-stopped

    ports:
      - "127.0.0.1:27017:27017"

    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all

    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
